<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa"><meta name="description" content="在浏览器中查看 Fast2DGS PLY，原生 WebGPU，文件仅在本地读取。">
  <title>Fast2DGS Viewer</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header><a class="brand" href="./"><span class="mark">f<span>2</span></span> Fast2DGS <span class="muted">Viewer</span></a><div class="header-right"><span class="badge">LOCAL · WEBGPU</span><a href="https://github.com/565353780/fast-2dgs-viewer" target="_blank" rel="noopener">源码 ↗</a></div></header>
<main id="stage">
  <canvas id="canvas" aria-label="2D Gaussian 模型视图" tabindex="0"></canvas>
  <section id="welcome">
    <div class="eyebrow">FAST 2D GAUSSIAN SPLATTING</div>
    <div class="orb" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <h1>让你的面片，呈现立体。</h1>
    <p>打开 Fast2DGS PLY，自由探索每一个视角。</p>
    <button id="open-main" class="primary">打开 PLY 文件 <span>↗</span></button>
    <p class="fine">或将文件拖到此处 · 文件仅在浏览器本地读取</p>
    <div class="specs"><span>双轴 Surfel</span><span>完整 SH₃ 色彩</span><span>原生 WebGPU</span></div>
  </section>
  <div id="drop-hint" hidden>释放以打开 PLY 文件</div>
  <div id="message" role="status" aria-live="polite"></div>
  <div id="model-info" hidden><strong id="filename"></strong><span id="details"></span></div>
  <div id="toolbar" hidden>
    <button id="open" title="打开另一个 PLY">打开文件</button><span class="divider"></span>
    <button id="reset" title="重新适配模型 (F)">适配视图</button>
    <button id="rotate" aria-pressed="false">自动旋转</button>
    <label class="background" title="背景颜色">背景 <input id="background" type="color" value="#ffffff" aria-label="背景颜色"></label>
    <label>清晰度 <select id="quality" aria-label="渲染清晰度"><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="0.75">0.75×</option><option value="0.5">0.5×</option></select></label>
    <button id="save" title="保存当前图像">保存 PNG</button>
  </div>
  <input type="file" id="file" accept=".ply" hidden>
</main>
<footer><span id="help">拖动旋转 · 右键 / Shift 拖动平移 · 滚轮缩放 · F 适配</span><span id="stats">等待打开模型</span></footer>
<script type="module" src="./app.js"></script>
</body>
</html>
